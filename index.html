<!doctype html><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مافیا آنلاین</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#1e293b);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:92%;
  max-width:430px;
  background:#172033;
  padding:28px 22px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 15px 40px #0008;
}

h1{
  margin-top:0;
  font-size:34px;
}

p{
  color:#cbd5e1;
}

input{
  width:100%;
  padding:15px;
  margin:10px 0;
  border:0;
  border-radius:12px;
  background:#263449;
  color:white;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#7c3aed;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#game{
  display:none;
}

.players{
  margin-top:20px;
  background:#263449;
  padding:15px;
  border-radius:15px;
  text-align:right;
}

.player{
  padding:9px;
  border-bottom:1px solid #ffffff18;
}

.player:last-child{
  border-bottom:0;
}

#message{
  margin-top:15px;
  color:#a78bfa;
  min-height:24px;
}
</style>
</head>

<body>

<div class="box" id="home">

  <h1>🎭 مافیا آنلاین</h1>

  <p>وارد بازی شو و آماده مافیا باش!</p>

  <input
    id="name"
    type="text"
    placeholder="اسم بازیکن"
    maxlength="20"
  >

  <button onclick="startGame()">
    🎮 شروع بازی
  </button>

  <div id="message"></div>

</div>


<div class="box" id="game">

  <h1>🎭 مافیا</h1>

  <p id="welcome"></p>

  <div class="players">

    <h3>👥 بازیکنان</h3>

    <div class="player">🧑 بازیکن ۱</div>
    <div class="player">🧑 بازیکن ۲</div>
    <div class="player">🧑 بازیکن ۳</div>
    <div class="player">🧑 بازیکن ۴</div>

  </div>

  <button onclick="backHome()">
    🔙 برگشت
  </button>

</div>


<script>

function startGame(){

  const name =
    document.getElementById("name").value.trim();

  if(name === ""){
    document.getElementById("message").textContent =
      "اول اسمت رو وارد کن 😎";
    return;
  }

  document.getElementById("home").style.display="none";
  document.getElementById("game").style.display="block";

  document.getElementById("welcome").textContent =
    "خوش اومدی " + name + " 🔥";

}

function backHome(){

  document.getElementById("game").style.display="none";
  document.getElementById("home").style.display="block";

}

</script>

</body>
</html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مافیا آنلاین</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#111827;color:#fff;margin:0;padding:20px}
    .box{max-width:520px;margin:auto;background:#1f2937;border-radius:18px;padding:20px}
    input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:0}
    input{background:#374151;color:#fff}button{background:#22c55e;color:#fff;font-weight:700}
    #chat{height:280px;overflow:auto;background:#111827;border-radius:12px;padding:10px;margin-top:15px}
    .msg{padding:6px 0;border-bottom:1px solid #374151}
  </style>
</head>
<body>
<div class="box">
  <h1>🎭 مافیا آنلاین</h1>
  <input id="name" placeholder="اسم بازیکن">
  <input id="room" value="main" placeholder="نام اتاق">
  <button onclick="join()">شروع بازی</button>

  <div id="game" hidden>
    <h3>بازیکنان</h3>
    <div id="players">هنوز کسی وارد نشده</div>
    <div id="chat"></div>
    <input id="message" placeholder="پیام..." onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">ارسال</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let currentRoom = "main";

function join(){
  const name = document.getElementById("name").value.trim() || "بازیکن";
  currentRoom = document.getElementById("room").value.trim() || "main";
  socket.emit("joinGame",{name,room:currentRoom});
  document.getElementById("game").hidden=false;
}

function send(){
  const el=document.getElementById("message");
  if(!el.value.trim()) return;
  socket.emit("chat",{room:currentRoom,message:el.value});
  el.value="";
}

socket.on("players", list=>{
  document.getElementById("players").textContent =
    list.length ? list.map((x,i)=>`${i+1}. ${x}`).join(" | ") : "هنوز کسی وارد نشده";
});

socket.on("chat", data=>{
  const box=document.getElementById("chat");
  const p=document.createElement("div");
  p.className="msg";
  p.textContent=`${data.name}: ${data.message}`;
  box.appendChild(p);
  box.scrollTop=box.scrollHeight;
});

socket.on("system", msg=>{
  const box=document.getElementById("chat");
  const p=document.createElement("div");
  p.className="msg";
  p.textContent=`⚙️ ${msg}`;
  box.appendChild(p);
});
</script>
</body>
</html>
